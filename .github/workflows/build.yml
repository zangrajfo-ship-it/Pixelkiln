name: build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build (Debug and Release, warnings are errors)
        run: |
          dotnet build -c Debug -warnaserror
          dotnet build -c Release -warnaserror
      # the UI smoke test (tools/smoke.ps1) needs a desktop, so it runs on a developer's machine only
      - name: Test
        run: dotnet test -c Release --no-build
